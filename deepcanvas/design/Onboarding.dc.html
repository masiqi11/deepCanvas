<x-dc>
<helmet>

<style>
body{margin:0;font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:#1d1d1f;background:#f5f5f7}
a{color:#2456e6;text-decoration:none}a:hover{color:#1a3fb0}
button{font:inherit;cursor:pointer}
</style>

<div style="min-height: 940px; padding: 56px 24px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 28px; font-size: 14px; line-height: 1.5">
<div style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 26 26"><rect width="26" height="26" rx="7" fill="#2456e6"/><rect x="6" y="14" width="3.4" height="7" rx="1.5" fill="#fff"/><rect x="11.3" y="10" width="3.4" height="11" rx="1.5" fill="#fff"/><rect x="16.6" y="6" width="3.4" height="15" rx="1.5" fill="#fff"/></svg>
<span style="font-weight: 700; font-size: 17px">DeepCanvas</span>
</div>
<form aria-label="先认识一下你" style="width: 100%; max-width: 620px; background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.08); padding: 36px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<header>
<div role="img" aria-label="第 1 步，共 3 步" style="display: flex; gap: 6px; margin-bottom: 18px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #2456e6"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #e3e3e8"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #e3e3e8"></span></div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">先认识一下你</h1>
<p style="margin: 6px 0 0; color: #5f5f66">三个问题，一分钟。答完我就能替你记住该读什么、该交什么。</p>
</header>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="field" style="font-weight: 600">你在研究什么方向？</label>
<input id="field" type="text" value="扩散模型，刚开始" style="min-height: 48px; padding: 0 16px; border: 2px solid #2456e6; border-radius: 12px; font: inherit">
<div style="font-size: 12.5px; color: #5f5f66">不确定也没关系，写“还没定”就行。</div>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-weight: 600; padding: 0; margin-bottom: 8px">现在是哪个阶段？</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 1px solid #e3e3e8; border-radius: 22px; background: #fff; color: #1d1d1f">本科高年级</button>
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 18px; border: 2px solid #2456e6; border-radius: 22px; background: #eef2ff; color: #1a3fb0; font-weight: 600">研一</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 1px solid #e3e3e8; border-radius: 22px; background: #fff; color: #1d1d1f">研二 / 研三</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 1px solid #e3e3e8; border-radius: 22px; background: #fff; color: #1d1d1f">博士</button>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="week" style="font-weight: 600">这周最让你头疼的是什么？</label>
<textarea id="week" rows="3" placeholder="想到什么写什么，比如：周三组会要讲论文，周五交课程设计，实验还差两组……" style="padding: 12px 16px; border: 1px solid #e3e3e8; border-radius: 12px; font: inherit; resize: vertical"></textarea>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between">
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #5f5f66">先跳过，直接开始</a>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 24px; background: #2456e6; color: #fff; font-weight: 600">帮我排好这一周</a>
</div>
</form>
<div style="display: flex; gap: 10px; align-items: center; max-width: 620px; color: #5f5f66; font-size: 13px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><rect x="3.5" y="8" width="11" height="7.5" rx="2" fill="none" stroke="#5f5f66" stroke-width="1.5"/><path d="M6 8V5.8a3 3 0 0 1 6 0V8" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-linecap="round"/></svg>
<span>你填的内容、读过的论文和日程只保存在这台电脑上，随时可以在设置里查看和删除。</span>
</div>
</div>
</x-dc>
